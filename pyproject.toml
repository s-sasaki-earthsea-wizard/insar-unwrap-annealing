[project]
name = "insar-unwrap-annealing"
version = "0.0.1"
description = "Benchmark skeleton: InSAR phase unwrapping as a QUBO, solved with SA and SQA, compared against SNAPHU"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Syota Sasaki", email = "syota.sasaki@earthsea-wizard.com" }]
dependencies = [
  "numpy>=2.0",
  "dimod>=0.12",
  "dwave-samplers>=1.8",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.scripts]
insar-unwrap = "insar_unwrap.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insar_unwrap"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
