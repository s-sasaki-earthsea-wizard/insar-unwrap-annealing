# Example experiment configuration for insar-unwrap.
#
# Validate with:  uv run --locked insar-unwrap validate-config --config configs/experiment.example.yaml
#
# Validation checks syntax and numerical consistency only. It does NOT check
# that input.path exists, so this file validates before any data is downloaded.
# Fetch the input with `make fetch-sample DATASET=nisar_sample_alos1_gunw_d00404`
# and check the wiring with `make crop-summary`.

experiment:
  name: nisar-gunw-sa-vs-sqa-pilot
  seed: 20261102            # forwarded to samplers that accept `seed`
  output_dir: results/pilot # created at run time; never versioned

input:
  kind: nisar_gunw          # nisar_gunw | synthetic
  # Plumbing sample only: NISAR-format GUNW generated from ALOS-1 PALSAR data
  # (D00404). Not a NISAR observation, almost no fringes; never use it for
  # measurements. See configs/datasets.yaml.
  path: data/raw/nisar_sample_alos1_gunw_d00404/NISAR_L2_PR_GUNW_001_030_A_019_002_2000_SH_20081012T060911_20081012T060925_20081127T061000_20081127T061014_D00404_N_F_J_001.h5
  frequency: A
  polarization: HH
  layers:
    # Verified on D00404 (product spec 1.2.1) and P05023 (spec 1.5.0). The
    # wrapped, coherence and mask layers must share one grid; read_crop checks
    # their coordinate arrays. The 80 m unwrappedInterferogram group is a
    # different grid and is not an input.
    wrapped: /science/LSAR/GUNW/grids/frequencyA/wrappedInterferogram/HH/wrappedInterferogram
    coherence: /science/LSAR/GUNW/grids/frequencyA/wrappedInterferogram/HH/coherenceMagnitude
    mask: /science/LSAR/GUNW/grids/frequencyA/wrappedInterferogram/mask
  crop:
    # Origin (row, col) of the crop on the native 20 m grid. Windows of each
    # size in problem.sizes are cut from this origin. No resampling is applied.
    # (2048, 1792) is a fully valid 256x256 window of D00404.
    row0: 2048
    col0: 1792
  mask:
    use_valid_mask: true     # decode fill / subswath / anomaly bits of the mask
    exclude_water: true
    coherence_threshold: 0.3 # pixels below this are treated as invalid

problem:
  # Progressive evaluation: each size is a full image, not a tiling.
  # 256 is a target, not a demonstrated capability.
  sizes: [32, 64, 128, 256]
  # Integer ambiguity k_i in phi_i = psi_i + 2*pi*k_i.
  # With binary encoding, 4 labels -> 2 bits/pixel. This is a choice, not a law.
  label_min: -2
  label_max: 1
  encoding: binary          # binary | one_hot
  edge_weighting: coherence # uniform | coherence
  reference:
    # none: free gauge, labels compared modulo one constant per component.
    # per_component / pixel: pinned gauge (exact tests, comparison arm).
    mode: none              # none | per_component | pixel
    # pixel: [0, 0]         # only when mode == pixel

solvers:
  sa:
    # dwave.samplers.SimulatedAnnealingSampler
    enabled: true
    num_reads: 20
    num_sweeps: 1000
    beta_schedule_type: geometric
    # beta_range: [0.1, 10.0]  # omit to let the sampler derive it from the BQM
  sqa:
    # dwave.samplers.PathIntegralAnnealingSampler (dwave-samplers >= 1.8).
    # This is a classical path-integral Monte Carlo simulation of a transverse-field
    # Ising model. It is not a state-vector simulation and does not reproduce QPU
    # real-time dynamics.
    #
    # Always run with beta_schedule_type="custom". The sampler's linear/geometric
    # schedules use a zero transverse field (its Gamma argument is overwritten),
    # which is classical annealing; they are therefore not offered here.
    enabled: true
    num_reads: 20
    num_sweeps_per_beta: 1
    schedule:
      # Fixed inverse temperature; transverse field Gamma decreases linearly.
      # Units: BQM energy. UNTUNED starting values, to be calibrated on synthetic data.
      beta: 10.0
      gamma_start: 3.0
      gamma_end: 0.0
      num_steps: 1000       # sweeps per read = num_steps * num_sweeps_per_beta
    # Alternative: explicit Hp_field / Hd_field lists (same length, non-negative,
    # Hd_field > 0 somewhere). Remove `schedule` when using them.
  snaphu:
    # External reference unwrapper. Different objective; compared as an image
    # processing result, not as a QUBO solver.
    enabled: false
    executable: snaphu
    # config_template: configs/snaphu.conf
